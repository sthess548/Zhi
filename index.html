        </div>

        <img class="conditional left-reveal image-7" data-zone="left" src="./assets/image-7.png" alt="" />

        <img class="conditional right-reveal image-9" data-zone="right" src="./assets/image-9.png" alt="" />
        <img class="conditional right-reveal pen-1" data-zone="right" src="./assets/pen-1.svg" alt="" />

        <div class="after-title image-8">
          <img src="./assets/image-8.png" alt="" />
        </div>
        <img class="after-title pen-2" src="./assets/pen-2.svg" alt="" />
        <div class="draw-hover-zone" aria-hidden="true"></div>
      </section>
    </main>
    <script>
const stage = document.querySelector(".stage");
const glow = document.querySelector(".cursor-glow");
const reactiveTiles = [...document.querySelectorAll(".float-react")];
const proximityItems = [...document.querySelectorAll(".proximity")];
const drawHoverZone = document.querySelector(".draw-hover-zone");
const drawReplayTargets = [document.querySelector(".image-8"), document.querySelector(".pen-2")];
let drawReplayArmed = true;
let drawReplayTimer = null;
const zones = [
  {
    name: "left",
    x: 455,
    y: 575,
    radius: 285,
    nodes: [...document.querySelectorAll('[data-zone="left"]')],
  },
  {
    name: "right",
    x: 1332,
    y: 530,
    radius: 330,
    nodes: [...document.querySelectorAll('[data-zone="right"]')],
  },
];

function resizeStage() {
  const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stage.style.setProperty("--stage-scale", scale.toString());
}

function getStagePoint(event) {
  const rect = stage.getBoundingClientRect();
  return {
    x: ((event.clientX - rect.left) / rect.width) * 1920,
    y: ((event.clientY - rect.top) / rect.height) * 1080,
  };
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function updateZones(point) {
  zones.forEach((zone) => {
    const active = distance(point, zone) <= zone.radius;
    zone.nodes.forEach((node) => node.classList.toggle("visible", active));
  });
}

function updateCorners(point) {
  proximityItems.forEach((item) => {
    const target = {
      x: Number(item.dataset.proximityX),
      y: Number(item.dataset.proximityY),
    };
    const radius = Number(item.dataset.proximityRadius);
    item.classList.toggle("near", distance(point, target) <= radius);
  });
}

function updateTiles(point) {
  reactiveTiles.forEach((tile) => {
    const rect = tile.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const center = {
      x: ((rect.left + rect.width / 2 - stageRect.left) / stageRect.width) * 1920,
      y: ((rect.top + rect.height / 2 - stageRect.top) / stageRect.height) * 1080,
    };
    const d = distance(point, center);
    const magnet = tile.querySelector(".magnet");

    if (d > 260) {
      magnet.style.transform = "translate3d(0, 0, 0)";
      return;
    }

    const force = (1 - d / 260) * 15;
    const angle = Math.atan2(center.y - point.y, center.x - point.x);
    const x = Math.cos(angle) * force;
    const y = Math.sin(angle) * force;
    magnet.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0)`;
  });
}

function resetInteraction() {
  stage.classList.remove("is-active");
  zones.forEach((zone) => {
    zone.nodes.forEach((node) => node.classList.remove("visible"));
  });
  proximityItems.forEach((item) => item.classList.remove("near"));
  reactiveTiles.forEach((tile) => {
    tile.querySelector(".magnet").style.transform = "translate3d(0, 0, 0)";
  });
}

function replayDrawOnce() {
  if (!drawReplayArmed) {
    return;
  }

  drawReplayArmed = false;
  window.clearTimeout(drawReplayTimer);
  drawReplayTargets.forEach((target) => target.classList.remove("replay-draw", "draw-complete"));
  drawReplayTargets.forEach((target) => void target.offsetWidth);

  window.requestAnimationFrame(() => {
    drawReplayTargets.forEach((target) => target.classList.add("replay-draw"));
  });

  drawReplayTimer = window.setTimeout(() => {
    drawReplayTargets.forEach((target) => {
      target.classList.remove("replay-draw");
      target.classList.add("draw-complete");
    });
  }, 720);
}

function armDrawReplay() {
  drawReplayArmed = true;
}

function handlePointerMove(event) {
  const point = getStagePoint(event);
  stage.classList.add("is-active");
  glow.style.transform = `translate3d(${point.x}px, ${point.y}px, 0)`;
  updateZones(point);
  updateCorners(point);
  updateTiles(point);
}

window.addEventListener("resize", resizeStage);
drawHoverZone.addEventListener("pointerenter", replayDrawOnce);
drawHoverZone.addEventListener("pointerleave", armDrawReplay);
stage.addEventListener("pointermove", handlePointerMove);
stage.addEventListener("pointerleave", resetInteraction);
resizeStage();

    </script>
  </body>
</html>
